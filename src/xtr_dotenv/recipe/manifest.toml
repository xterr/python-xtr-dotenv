# The recipe for xtr-dotenv: what *Use in an application* in the README takes,
# as data. Keep the two in step — the README is the source.

[bundles]
# "<module>:<class>" = the environments it is listed with, exactly as in BUNDLES.
# It adds dotenv:dump and debug:dotenv, and only when the console bundle is
# active; loading the files is not the bundle's doing — see [notes].
"xtr_dotenv.bundle:DotenvBundle" = { all = true }

[files]
# Destination under the application package = template under this recipe.
# The one description of the cascade: the entry point boots the environment
# from the DOTENV it holds before the kernel builds, and dotenv:dump and
# debug:dotenv read the same object from the container — the cascade is
# described there, and nowhere else.
"config/packages/dotenv.py" = "files/config/dotenv.py.tmpl"

[env]
# The defaults every machine shares go in .env, and .env is committed. The
# environment the kernel runs in is the first of them.
APP_ENV = "dev"

[gitignore]
# Per-machine overrides, and what `dotenv:dump` writes: regenerated, never
# committed.
lines = ["/.env.local", "/.env.*.local", "/.env.local.json"]

[notes]
steps = [
  "Call DOTENV.boot(PROJECT_DIR) at the top of every entry point, before the kernel is built: DOTENV comes from config/packages/dotenv.py.",
]
check = [
  "<script> debug:dotenv — the environment, production and debug flags, and each file of the cascade, loaded or missing (values masked unless --show-values)",
]
